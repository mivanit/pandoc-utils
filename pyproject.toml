[project]
name = "pandoc-utils"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandocfilters",
    "pandas",
    "pyyaml",
]

[dependency-groups]
dev = [
    "playwright",  # html-papers/tests: the scripts in a headless browser
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
exclude = [".old"]

[tool.ty.src]
# plot_words.py: the demo paper's script that runs only in the page, where matplotlib is
# fetched with Python; it is not a dependency here
exclude = [".old", "**/plot_words.py"]
