[project]
name = "pandoc-utils"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandocfilters",
    "pandas",
    "pyyaml",
]

[dependency-groups]
dev = [
    "playwright",  # html-papers/tests: the scripts in a headless browser
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
exclude = [".old"]

[tool.ty.src]
exclude = [".old"]
