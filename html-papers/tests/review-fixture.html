<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Review fixture</title>
		<meta name="review-doc-version" content="abc123" />
		<style>
			body {
				max-width: 40rem;
				margin: 2rem;
				font: 16px/1.5 serif;
			}
		</style>
	</head>
	<body>
		<!-- driven by test_review_typing.py: real keystrokes, which an in-page test cannot send -->
		<h1 id="top">Intro</h1>
		<p id="fox">
			The quick brown fox jumps over the lazy dog near the riverbank
			today.
		</p>
		<p id="prog">
			<a id="lnk" href="#top">link</a> Programs read only the prefix,
			guaranteeing autoregressivity.
		</p>
		<input id="field" aria-label="A field of the page's own" />
		<p id="filler"></p>
		<script>
			document.querySelector("#filler").textContent = Array.from(
				{ length: 200 },
				(_, i) => `Filler sentence number ${i}.`,
			).join(" ");
		</script>
		<script
			src="../review.js"
			data-review-email="me@example.org"
		></script>
	</body>
</html>
